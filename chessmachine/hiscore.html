<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>ChessMachine</title>

        <!-- WinJS references -->
        <link href="//Microsoft.WinJS.1.0/css/ui-dark.css" rel="stylesheet" />
        <script src="//Microsoft.WinJS.1.0/js/base.js"></script>
        <script src="//Microsoft.WinJS.1.0/js/ui.js"></script>

        <!-- ChessMachine references -->
        <link href="css/default.css" rel="stylesheet" />
        <script src="js/default.js"></script>
        <script src="Scripts/globalize/globalize.min.js"></script>
        <script src="Scripts/globalize/cultures/globalize.cultures.min.js"></script>
        
        <link href="css/chessmachine.css" rel="stylesheet" />

        <script src="Scripts/knockout-3.0.0.js"></script>

        <script src="js/common/common.min.js" type="text/javascript" defer="defer"></script>
        <script src="js/common/culture.min.js" type="text/javascript" defer="defer"></script>
        
        <script src="js/hiscore/hiscore.min.js" type="text/javascript" defer="defer"></script>
        <script src="js/hiscore/hiscoreviewmodel.min.js" type="text/javascript" defer="defer"></script>
        <script src="js/hiscore/hiscorebinding.min.js" type="text/javascript" defer="defer"></script>
    </head>
    <body>
        <div id="overlay"></div>
        <div id="specialBox">
            <fieldset>
            <legend id="hiscore-yourHiscore">Your Hi-score:</legend>
            <div>
                <label id="hiscore-games">Games</label>
                <label id="gamesHiscore" class="bold">Games</label>
            </div>
            <div>
                <label id="hiscore-coinPurses">Coin Purses</label>
                <label id="coinPursesHiscore" class="bold">Coin Purses</label>
            </div>
            <div>
                <label id="hiscore-date">Date</label>
                <label id="todayHiscore" class="bold">Date</label>
            </div>
            <div>
                <label id="hiscore-enterYourName">Enter your name</label>
                <form>
                    <input type="text" name="name" id="nameHiscore" placeholder="Superman"><br>
                </form>
            </div>
        </fieldset>
            
            <div>
                <button id="hiscore-ok" type="button" class="buttonOk" onclick="hiscoreViewModel.addHiscore()">Ok</button>
              <button id="hiscore-cancel" type="button" class="buttonClose" onclick="hiscoreViewModel.toggleOverlay()">Cancel</button>
            </div>
        </div>
        <div id="wrapper">
            <h1 id="hiscore-title">Hi-Scores</h1>
            <table class="hiscore">
            <thead>
              <tr>
                <th id="hiscore-scores" class="thhiscore">Scores</th>
                <th id="hiscore-coinPurses2" class="thhiscore">Coin Purses</th>
                <th id="hiscore-games2" class="thhiscore">Games</th>
                <th id="hiscore-date2" class="thhiscore">Date</th>
                <th id="hiscore-name" class="thhiscore">Name</th>
              </tr>
            </thead>
            <tbody data-bind="foreach: hiscores">
              <tr class="hiscore">
                  <td><div class="texthiscore numberhiscore" data-bind="text: score"></div></td>
                  <td><div class="texthiscore numberhiscore" data-bind="text: coinPurses"></div></td>
                  <td><div class="texthiscore numberhiscore" data-bind="text: games"></div></td>
                  <td><div class="texthiscore"data-bind="text: date"></div></td>
                  <td><div class="texthiscore"data-bind="text: name"></div></td>
              </tr>
            </tbody>
          </table>
            <div>
                <button id="hiscore-menu" type="button" onclick="window.location.href='menu.html'">Menu</button>
            </div>
        </div>
    </body>
</html>

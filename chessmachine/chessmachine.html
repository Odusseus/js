<!DOCTYPE html>
<html>
    <head>
        <meta charset="utf-8" />
        <title>ChessMachine</title>

        <!-- WinJS references -->


        <!-- ChessMachine references -->

        <link href="css/chessmachine.css" rel="stylesheet" />

        <script src="Scripts/globalize/globalize.min.js"></script>
        <script src="Scripts/globalize/cultures/globalize.cultures.min.js"></script>

        <script src="js/common/common.min.js" type="text/javascript"></script>
        <script src="js/common/culture.min.js" type="text/javascript"></script>

        <script src="js/option/options.min.js" type="text/javascript" defer="defer"></script>
        <script src="js/chessmachine/game.min.js" type="text/javascript" defer="defer"></script>
        <script src="js/chessmachine/card.min.js" type="text/javascript" defer="defer"></script>
        <script src="js/chessmachine/carousel.min.js" type="text/javascript" defer="defer"></script>
        <script src="js/chessmachine/chessmachine.min.js" type="text/javascript" defer="defer"></script>
    </head>
    <body>
        <div id="overlay"></div>

        <div id="specialBox">
            <h2 id="chessmachine-youLoseAllYourCoins">You lose all your coins!</h2> 
            <div>
              <button id="chessmachine-close" type="button" class="buttonClose" onclick="ChessMachine.Main.toggleOverlay()">Close</button>
            </div>
        </div>

        <div id="wrapper">
            <div id="blockHead">
                <h1 id="chessmachine-title">ChessMachine</h1>
                <table>
                    <thead>
                        <tr>
                            <th id="chessmachine-coinPurses">Coin purses</th>
                            <th id="chessmachine-cashRegister">Cash register</th>
                            <th id="chessmachine-games">Games</th>
                        </tr>
                    </thead>
                    <tbody>
                        <tr>
                            <td id="coinPurses">0</td>
                            <td  id="cashRegister">0</td>
                            <td id="games">0</td>
                        </tr>
                    </tbody>
                </table>
                 <div class="result clearboth">
                    <div id="win1" class="clearboth">
                        <span id="chessmachine-3xSamePieces" class="text1" title="3x same pieces = win">3x</span>
                        <span class="alarm1">&nbsp;</span>
                        <span id="chessmachine-3xSamePiecesAndColor" class="text2" title="3x same pieces and color = win x 2">Color</span>
                        <span class="alarm2"></span>
                    </div>
                    <div id="win2" class="clearboth">
                        <span  id="chessmachine-2xSamePieces" class="text1" title="2x King, Queen, Bishop, Knight, Rook = win">2x</span>
                        <span class="alarm1">&nbsp;</span>
                        <span id="chessmachine-2xSamePiecesAndColor" class="text2" title="2x King, Queen, Bishop, Knight, Rook and color = win x 2">Color</span>
                        <span class="alarm2"></span>
                    </div>
                    <div id="win3" class="clearboth" >
                        <span id="chessmachine-1xKingLuckyNumber" class="text1" title="1x King + lucky number = win">1x King</span>
                        <span class="alarm1">&nbsp;</span>
                        <span id="chessmachine-1xQueenLuckyNumber" class="text2" title="1x Queen + lucky number = win">1x Queen</span>
                        <span class="alarm2"></span>
                    </div>
                    <div id="luckyNumber" class="clearboth">
                        <span id="chessmachine-luckyNumberIsYour4" class="luckyNumber1" title="lucky number = your number = win">lucky number is 4 </span>
                        <div class="textLuckNumber">
                            <span class="win"></span>
                            <span class="lose"></span>
                        </div>
                        <div id="grid">
                            <div id="item1" class="default">1</div>
                            <div id="item2" class="default">2</div>
                            <div id="item3" class="default">3</div>
                            <div id="item4" class="default">4</div>
                        </div>
                </div>
            </div>
            <div class="win clearboth">
                 <span id="chessmachine-winAmount" class="text">Win</span>
                 <span id="win">0</span>
            </div>
         </div>
        <div class="carousels clearboth">
            <div class="carousel">
                <div id="nextCarousel1" class="whitebishop" title="3 coins"></div>
                <div id="carousel1" class="whiteking defaultCardBorder" title="50 coins"></div>
                <div id="previousCarousel1" class="whitebishop" title="3 coins"></div>
                <div class="carouselButton">
                    <button type="button" onclick="ChessMachine.Main.setLockFirstCard()" id="chessmachine-lockFirstCard" class="lockDefault">Lock</button>
                </div>
            </div>
            <div class="carousel">
                <div id="nextCarousel2" class="whitebishop" title="3 coins"></div>
                <div id="carousel2" class="blackqueen defaultCardBorder" title="9 coins"></div>
                <div id="previousCarousel2" class="whitebishop" title="3 coins"></div>
                <div class="carouselButton">
                    <button type="button" onclick="ChessMachine.Main.setLockSecondCard()" id="chessmachine-lockSecondCard" class="lockDefault">Lock</button>
                </div>
            </div>
            <div class="carousel">
                <div id="nextCarousel3" class="whitebishop" title="3 coins"></div>
                <div id="carousel3" class="whiteking defaultCardBorder" title="50 coins"></div>
                <div id="previousCarousel3" class="whitebishop" title="3 coins"></div>
                <div class="carouselButton">
                    <button type="button" onclick="ChessMachine.Main.setLockThirdCard()" id="chessmachine-lockThirdCard" class="lockDefault">Lock</button>
                </div>
            </div>
        </div>

        <div id="play" class="clearboth">
            <button id="chessmachine-playButton" type="button" onclick="ChessMachine.Main.play()" class="playButton">New game</button>
        </div>
        <div id="optionsButton" class="clearboth">
            <button id="chessmachine-menu" type="button" onclick="window.location.href='menu.html'">Menu</button>
            <button id="chessmachine-add5Coins" type="button" onclick="ChessMachine.Main.addCoins()">add 5 coins</button>
        </div>
   
  </div>

        <!--<div id="info">info</div>-->
    </body>
</html>
